<header data-app-header
  class="mk-panel sticky top-3 flex w-full z-(--z-app-header)">
  <div class="flex flex-col items-center justify-between grow xl:flex-row xl:px-5">
    <div
      class="flex items-center justify-between w-full gap-2 px-3 py-3 border-b border-line sm:gap-4 xl:justify-normal xl:border-b-0 xl:px-0 xl:py-3">
      @let pinned = (sidebarService.isExpanded$ | async) === true;
      <!-- Wide screens: the pin fixes the menu open (pressed, filled, in the action colour) or lets it fold to icons (outline, muted). It is the same toggle as before. -->
      <button type="button" data-sidebar-pin
        class="hidden size-11 items-center justify-center rounded-control border border-line text-ink-muted transition hover:bg-tint active:translate-y-px focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-action/40 xl:flex"
        [attr.aria-pressed]="pinned" [attr.aria-label]="(pinned ? 'SHELL.NAV.UNPIN' : 'SHELL.NAV.PIN') | translate"
        (click)="handleToggle()">
        <span class="material-symbols-rounded text-[24px]" aria-hidden="true" [ngClass]="pinned ? 'text-action' : 'text-ink-muted'"
          [style.font-variation-settings]="pinned ? '\'FILL\' 1' : '\'FILL\' 0'">push_pin</span>
      </button>
      <!-- Phones and tablets: the menu button opens and closes the drawer. -->
      @let mobileOpen = (isMobileOpen$ | async) === true;
      <button type="button" class="mk-btn-icon lg:size-11 xl:hidden" [class.bg-tint]="mobileOpen" [attr.aria-expanded]="mobileOpen"
        (click)="handleToggle()" [attr.aria-label]="'SHELL.NAV.TOGGLE_SIDEBAR' | translate">
        <span class="material-symbols-rounded text-[24px]" aria-hidden="true">{{ mobileOpen ? 'close' : 'menu' }}</span>
      </button>
      <!-- Logo (placeholder) -->
      <a routerLink="/" class="xl:hidden">
        <img class="dark:hidden" src="/images/logo/logo-light.svg" [attr.alt]="'SHELL.NAV.LOGO_ALT' | translate" width="200" />
        <img class="hidden dark:block" src="/images/logo/logo-dark.svg" [attr.alt]="'SHELL.NAV.LOGO_ALT' | translate" width="200"/>
      </a>
      <button type="button" (click)="toggleApplicationMenu()" class="mk-btn-icon xl:hidden" [attr.aria-expanded]="isApplicationMenuOpen"
        [attr.aria-label]="'SHELL.HEADER.MORE' | translate">
        <span class="material-symbols-rounded text-[24px]" aria-hidden="true">more_vert</span>
      </button>
      <div class="hidden xl:block">
        <form>
          <div class="relative">
            <span class="absolute -translate-y-1/2 pointer-events-none left-4 top-1/2">
              <!-- Search Icon -->
              <svg class="fill-ink-faint" width="20" height="20" viewBox="0 0 20 20" fill="none">
                <path fill-rule="evenodd" clip-rule="evenodd"
                  d="M3.04175 9.37363C3.04175 5.87693 5.87711 3.04199 9.37508 3.04199C12.8731 3.04199 15.7084 5.87693 15.7084 9.37363C15.7084 12.8703 12.8731 15.7053 9.37508 15.7053C5.87711 15.7053 3.04175 12.8703 3.04175 9.37363ZM9.37508 1.54199C5.04902 1.54199 1.54175 5.04817 1.54175 9.37363C1.54175 13.6991 5.04902 17.2053 9.37508 17.2053C11.2674 17.2053 13.003 16.5344 14.357 15.4176L17.177 18.238C17.4699 18.5309 17.9448 18.5309 18.2377 18.238C18.5306 17.9451 18.5306 17.4703 18.2377 17.1774L15.418 14.3573C16.5365 13.0033 17.2084 11.2669 17.2084 9.37363C17.2084 5.04817 13.7011 1.54199 9.37508 1.54199Z"
                  fill="" />
              </svg>
            </span>
            <input #searchInput type="text" [placeholder]="'SHELL.HEADER.SEARCH_PLACEHOLDER' | translate"
              class="h-10 w-full rounded-pill border border-transparent bg-canvas/60 py-2.5 pl-12 pr-14 text-sm text-ink placeholder:text-ink-faint focus:border-action focus:outline-hidden focus:ring-3 focus:ring-action/10 xl:w-[430px]" />
            <button
              class="absolute right-2.5 top-1/2 inline-flex -translate-y-1/2 items-center gap-0.5 rounded-control border border-line bg-canvas px-[7px] py-[4.5px] text-xs -tracking-[0.2px] text-ink-faint">
              <span> ⌘ </span>
              <span> K </span>
            </button>
          </div>
        </form>
      </div>
    </div>
    <div [ngClass]="isApplicationMenuOpen ? 'flex' : 'hidden'"
      class="items-center justify-end w-full gap-4 px-5 py-4 xl:flex bg-surface xl:px-0">
      <div class="flex items-center gap-4 sm:gap-5">
        <span class="mr-1 hidden h-8 w-px bg-line sm:block" aria-hidden="true" data-testid="header-separator"></span>
        @for (widget of widgets; track widget) {
          <ng-container *ngComponentOutlet="widget" />
        }
        <app-help-menu />
        <app-profile-menu />
      </div>
    </div>
  </div>
</header>
