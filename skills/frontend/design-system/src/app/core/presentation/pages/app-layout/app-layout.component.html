@let expanded = isExpanded$ | async;
@let hovered = isHovered$ | async;
<div class="min-h-screen p-3 xl:flex">
  <div>
    <app-sidebar></app-sidebar>
    <app-backdrop></app-backdrop>
  </div>
  <div
      class="min-w-0 flex-1 transition-all duration-300 ease-in-out"
      [ngClass]="{
        'xl:ml-[282px]': expanded || hovered,
        'xl:ml-[96px]': !expanded && !hovered,
        'ml-0': (isMobileOpen$ | async)
      }"
  >
    <app-header/>
    <!-- Content panel: floats on the canvas under the header; the same padding and maximum width in both apps -->
    <main class="mk-panel-content mt-3 min-h-[calc(100vh-6.5rem)] p-4 md:p-6">
      <div class="mx-auto max-w-(--breakpoint-2xl)">
        <router-outlet></router-outlet>
      </div>
    </main>
  </div>
</div>
