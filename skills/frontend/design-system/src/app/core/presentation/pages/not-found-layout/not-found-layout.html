<div class="relative flex flex-col items-center justify-center min-h-screen p-5 overflow-hidden z-1">
    <div class="absolute right-0 top-0 -z-1 w-full max-w-[250px] xl:max-w-[450px]">
        <img src="/images/shape/grid-01.svg" alt="grid" />
    </div>
    <div class="absolute bottom-0 left-0 -z-1 w-full max-w-[250px] rotate-180 xl:max-w-[450px]">
        <img src="/images/shape/grid-01.svg" alt="grid" />
    </div>

    <div class="mx-auto w-full max-w-[242px] text-center sm:max-w-[472px]">
        <h1 class="mb-8 font-bold text-ink text-title-md xl:text-title-2xl">
{{ 'COMMON.NOT_FOUND.TITLE' | translate }}
        </h1>

        <img src="/images/error/404.svg" alt="404" class="dark:hidden" />
        <img src="/images/error/404-dark.svg" alt="404" class="hidden dark:block" />

        <p class="mt-10 mb-4 text-base text-ink-muted sm:text-lg">
            {{ 'COMMON.NOT_FOUND.MESSAGE' | translate }}
        </p>

        <a routerLink="/"
            class="hover:text-ink mk-btn-secondary">
            {{ 'COMMON.NOT_FOUND.BACK_HOME' | translate }}
        </a>
    </div>

    <p class="absolute text-sm text-center text-ink-faint -translate-x-1/2 bottom-6 left-1/2">
        {{ 'COMMON.NOT_FOUND.COPYRIGHT' | translate: { year: currentYear } }}
    </p>
</div>
