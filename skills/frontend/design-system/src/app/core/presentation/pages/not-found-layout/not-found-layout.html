<div class="relative flex flex-col items-center justify-center min-h-dvh p-5 overflow-hidden z-1">
    <div class="absolute right-0 top-0 -z-1 w-full max-w-64 xl:max-w-md">
        <img src="/images/shape/grid-01.svg" alt="" />
    </div>
    <div class="absolute bottom-0 left-0 -z-1 w-full max-w-64 rotate-180 xl:max-w-md">
        <img src="/images/shape/grid-01.svg" alt="" />
    </div>

    <div class="mx-auto w-full max-w-60 text-center sm:max-w-md">
        <h1 class="mb-8 text-2xl font-semibold text-ink text-balance">
{{ 'COMMON.NOT_FOUND.TITLE' | translate }}
        </h1>

        <img src="/images/error/404.svg" alt="" class="dark:hidden" />
        <img src="/images/error/404-dark.svg" alt="" class="hidden dark:block" />

        <p class="mt-10 mb-4 text-base text-ink-muted text-pretty">
            {{ 'COMMON.NOT_FOUND.MESSAGE' | translate }}
        </p>

        <a routerLink="/"
            class="mk-btn-secondary">
            {{ 'COMMON.NOT_FOUND.BACK_HOME' | translate }}
        </a>
    </div>

    <p class="absolute text-sm text-center text-ink-faint -translate-x-1/2 bottom-6 left-1/2">
        {{ 'COMMON.NOT_FOUND.COPYRIGHT' | translate: { year: currentYear } }}
    </p>
</div>
