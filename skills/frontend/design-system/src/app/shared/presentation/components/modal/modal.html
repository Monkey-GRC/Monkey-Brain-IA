@if (open()) {
  <div class="fixed inset-0 z-[100001] flex items-center justify-center bg-scrim p-4 backdrop-blur-sm" (mousedown)="onBackdrop($event)" [attr.data-testid]="testId() + '-backdrop'">
    <div #panel role="dialog" aria-modal="true" tabindex="-1" [attr.aria-labelledby]="labelledBy()" [attr.aria-describedby]="describedBy()" (keydown)="trapTab($event)" [attr.data-testid]="testId() + '-dialog'"
      class="w-full rounded-panel border border-line bg-surface p-6 text-ink shadow-float outline-none" [class]="sizeClass">
      <ng-content />
    </div>
  </div>
}
