<!-- La etiqueta dice qué se filtra, en texto de cuerpo con peso medio y color principal, centrada con los chips y separada de ellos por una línea fina (MD-499). -->
<div class="flex flex-col gap-1.5 lg:flex-row lg:items-center lg:gap-3">
  @if (labelKey(); as key) {
  <span class="flex shrink-0 items-center gap-3 text-sm font-medium text-ink" aria-hidden="true" data-chips-label>{{ key | translate }}<span class="hidden h-5 w-px bg-line-strong lg:block"></span></span>
  }
<div class="flex flex-wrap" [class]="compact() ? 'gap-2' : 'gap-2.5'" role="group" [attr.aria-label]="ariaLabel() ?? (labelKey() ? (labelKey()! | translate) : 'Opciones')">
  @for (option of options(); track option.value) {
  <button type="button" [attr.data-option]="option.value" (click)="picked.emit(option.value)" [attr.aria-pressed]="isSelected(option.value)"
    class="group inline-flex items-center gap-2 rounded-control border text-sm font-medium transition focus:outline-none focus-visible:ring-2 focus-visible:ring-action/40"
    [class]="(compact() ? 'px-3 py-1.5 ' : 'px-4 py-2.5 ') + (isSelected(option.value) ? 'border-action bg-tint text-tint-ink' : 'border-line bg-surface text-ink-muted hover:border-action/50 hover:bg-tint')">
    @if (option.flag) {
    <img [src]="'/images/flags/' + option.flag + '.svg'" alt="" width="20" height="20" loading="lazy" decoding="async" class="size-5 shrink-0 rounded-full ring-1 ring-line" />
    } @else if (option.symbol) {
    <span class="material-symbols-rounded text-[20px] leading-none text-ink-faint" aria-hidden="true">{{ option.symbol }}</span>
    } @else if (isSelected(option.value)) {
    <span class="material-symbols-rounded text-[20px] leading-none">{{ multiple() ? 'check_circle' : 'check' }}</span>
    }
    {{ option.label }}
    @if ((option.flag || option.symbol) && isSelected(option.value)) {
    <span class="material-symbols-rounded text-[20px] leading-none" aria-hidden="true">{{ multiple() ? 'check_circle' : 'check' }}</span>
    }
  </button>
  }
</div>
</div>
