<label [for]="inputId()" class="mb-2 block font-medium" [class]="compact() ? 'text-xs text-ink-muted' : 'text-sm text-ink-muted'">{{ label() }}</label>
<div class="relative">
  <input [id]="inputId()" [formControl]="control()" [type]="visible() ? 'text' : 'password'" [attr.autocomplete]="autocomplete()" [attr.aria-describedby]="describedBy()" placeholder="••••••••"
    class="mk-input !h-10 !pr-12 md:!h-12 md:text-base" />
  <!-- Centrado: ocupa toda la altura del recuadro y se centra con margen automático. Sin tooltip nativo (title): tapaba el campo de abajo; el lector de pantalla lo anuncia con aria-label. -->
  <button type="button" (click)="visible.set(!visible())" [attr.aria-pressed]="visible()" [attr.aria-label]="(visible() ? 'COMMON.HIDE_PASSWORD' : 'COMMON.SHOW_PASSWORD') | translate" data-testid="password-eye"
    class="absolute inset-y-0 right-1.5 my-auto flex h-9 w-9 items-center justify-center rounded-control text-ink-muted transition-colors hover:text-ink focus:outline-none focus-visible:ring-2 focus-visible:ring-action/50">
    <span class="material-symbols-rounded text-[20px] leading-none md:text-[24px]" aria-hidden="true">{{ visible() ? 'visibility_off' : 'visibility' }}</span>
  </button>
</div>
