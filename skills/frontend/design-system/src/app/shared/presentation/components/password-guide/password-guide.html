<div [id]="guideId()" data-testid="password-guide" class="rounded-control border border-line bg-canvas" [class]="compact() ? 'p-3' : 'p-4'">
  <p class="font-medium text-ink-muted" [class]="compact() ? 'text-xs md:text-sm' : 'text-sm'">{{ 'COMMON.PASSWORD.GUIDE.TITLE' | translate }}</p>
  <ul class="mt-3 grid gap-x-6 gap-y-2" [class]="compact() ? 'grid-cols-1' : 'sm:grid-cols-2'" aria-live="polite">
    @for (check of checks(); track check.key) {
      <li class="flex items-center gap-2 transition-colors" [attr.data-check]="check.key" [attr.data-state]="check.state" [class]="compact() ? 'text-xs md:text-sm' : 'text-sm'"
        [class.text-ok-ink]="check.state === 'ok'"
        [class.text-bad-ink]="check.state === 'bad'"
        [class.text-ink-muted]="check.state === 'idle'">
        <span class="material-symbols-rounded text-[20px] leading-none" aria-hidden="true">{{ icon(check.state) }}</span>
        <span>{{ labelKey(check.key) | translate }}</span>
        <span class="sr-only">— {{ stateKey(check.state) | translate }}</span>
      </li>
    }
  </ul>
</div>
