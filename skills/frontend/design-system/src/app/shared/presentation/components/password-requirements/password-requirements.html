<div #panel [id]="balloonId()" data-testid="password-requirements" role="note" [hidden]="!visible()" [style]="style()"
  class="mk-enter motion-reduce:animate-none pointer-events-none fixed z-(--z-popover) rounded-card border border-line bg-surface p-4 text-sm text-ink shadow-float">
  @if (placement(); as p) {
    <span aria-hidden="true" data-arrow [attr.data-mode]="p.mode"
      class="absolute size-3 rotate-45 border-line bg-surface"
      [class]="p.mode === 'side' ? '-right-[7px] border-r border-t' : '-top-[7px] border-l border-t'"
      [style.top.px]="p.mode === 'side' ? p.arrow - 6 : null" [style.left.px]="p.mode === 'below' ? p.arrow - 6 : null"></span>
  }
  <p class="text-xs font-medium text-ink-muted">{{ 'COMMON.PASSWORD.REQUIREMENTS.TITLE' | translate }}</p>
  <ul class="mt-3 space-y-2.5">
    @for (check of checks(); track check.key) {
      <li class="flex items-center gap-2.5 transition-colors" [attr.data-check]="check.key" [attr.data-state]="check.state" [class.text-ink]="check.state === 'ok'" [class.text-ink-muted]="check.state !== 'ok'">
        <span class="flex size-5 shrink-0 items-center justify-center rounded-full border transition-colors"
          [class]="check.state === 'ok' ? 'border-ok bg-ok text-white' : 'border-ink-faint text-transparent'" aria-hidden="true">
          <span class="material-symbols-rounded text-[16px] leading-none">check</span>
        </span>
        <span>{{ labelKey(check.key) | translate }}</span>
      </li>
    }
  </ul>
</div>
