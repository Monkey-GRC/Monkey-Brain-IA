<div>
  @if (!useRecovery()) {
    <span class="block text-sm font-medium text-ink-muted mb-2">{{ 'COMMON.SECOND_FACTOR.CODE_LABEL' | translate }}</span>
    <app-code-input [(value)]="code" [label]="'COMMON.SECOND_FACTOR.CODE_LABEL' | translate" [disabled]="disabled()" [invalid]="invalid()" />
  } @else {
    <label for="recovery-code" class="block text-sm font-medium text-ink-muted mb-2">{{ 'COMMON.SECOND_FACTOR.RECOVERY_LABEL' | translate }}</label>
    <input id="recovery-code" type="text" autocomplete="off" maxlength="24" [value]="recoveryCode()" [disabled]="disabled()" (input)="onRecoveryInput($event)"
      [placeholder]="'COMMON.SECOND_FACTOR.RECOVERY_PLACEHOLDER' | translate"
      [attr.aria-invalid]="invalid() ? 'true' : null"
      class="mk-input !h-12 !text-base tracking-widest caret-ink aria-invalid:border-bad" />
  }
  @if (allowRecovery()) {
    <button type="button" (click)="toggle()" [disabled]="disabled()" class="mt-2 text-sm font-medium text-action enabled:hover:underline disabled:cursor-not-allowed disabled:text-ink-faint">
      {{ (useRecovery() ? 'COMMON.SECOND_FACTOR.USE_APP' : 'COMMON.SECOND_FACTOR.USE_RECOVERY') | translate }}
    </button>
  }
</div>
