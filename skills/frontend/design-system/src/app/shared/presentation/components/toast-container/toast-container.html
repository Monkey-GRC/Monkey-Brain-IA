<div
  role="status"
  aria-live="polite"
  [attr.aria-label]="'COMMON.TOAST.REGION' | translate"
  class="pointer-events-none fixed right-6 top-6 z-(--z-toast) flex w-[calc(100%-3rem)] max-w-sm flex-col gap-2"
  [style.top.px]="place()?.top"
  [style.right.px]="place()?.right"
  data-testid="toast-region"
>
  @for (item of service.toasts(); track item.id) {
    <div
      class="mk-toast pointer-events-auto"
      [class]="look[item.tone].card"
      [attr.role]="item.tone === 'error' ? 'alert' : null"
      [attr.data-tone]="item.tone"
      data-testid="toast"
      (mouseenter)="service.hold(item.id, 'hover')"
      (mouseleave)="service.release(item.id, 'hover')"
      (focusin)="service.hold(item.id, 'focus')"
      (focusout)="service.release(item.id, 'focus')"
    >
      <span class="material-symbols-rounded shrink-0 text-[24px] leading-6" [class]="look[item.tone].icon" aria-hidden="true" data-testid="toast-icon">{{ look[item.tone].glyph }}</span>
      <div class="min-w-0 flex-1 pt-0.5">
        <p class="wrap-break-word text-sm font-medium text-ink" data-testid="toast-title"><span class="sr-only" data-testid="toast-tone">{{ look[item.tone].labelKey | translate }}: </span>{{ item.title }}</p>
        @if (item.message) {
          <p class="mt-1 wrap-break-word text-sm text-ink-muted text-pretty" data-testid="toast-message">{{ item.message }}</p>
        }
      </div>
      <button
        type="button"
        (click)="service.dismiss(item.id)"
        [attr.aria-label]="'COMMON.CLOSE' | translate"
        [title]="'COMMON.CLOSE' | translate"
        class="-mr-1 -mt-1 inline-flex size-8 shrink-0 items-center justify-center rounded-control text-ink-muted transition hover:bg-tint hover:text-ink active:translate-y-px focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-action/40"
        data-testid="toast-close"
      >
        <span class="material-symbols-rounded text-[20px]" aria-hidden="true">close</span>
      </button>
    </div>
  }
</div>
